
##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Clipse clipboard window
windowrule {
  name = clipboard
  match:class = clipboard
  float = on
  size = 622 652
  stay_focused = on
}

# Used by btop app
windowrule {
  name = process # 9x9 -> 900px x 900px
  match:class = process
  float = on
  size = 900 865
  stay_focused = on
}

# Used by bluetooth and wifi
windowrule {
  name = wireless
  match:class = wireless
  float = on
  size = 922 652
  stay_focused = on
}

# Browser
windowrule {
  name = browser-chrome
  match:class = google-chrome
  monitor = eDP-1
}

